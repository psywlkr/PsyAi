<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="🐸Coqui AI TTS demo server.">
    <meta name="author" content="🐸Coqui AI TTS">

    <title>TTS engine</title>

    <!-- Bootstrap core CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
        integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous"
        rel="stylesheet">

    <!-- Custom styles for this template -->
    <style>
        :root {
            --black: #0a0a0a;
            --metallic-purple: #8b5a9f;
            --dark-purple: #4a2c54;
            --light-purple: #b388c4;
            --metallic-shine: linear-gradient(135deg, #8b5a9f 0%, #6b4a7f 50%, #8b5a9f 100%);
        }

        body {
            padding-top: 54px;
            background: var(--black);
            color: var(--light-purple);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        @media (min-width: 992px) {
            body {
                padding-top: 56px;
            }
        }

        .container {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a0a1f 50%, #0a0a0a 100%);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(139, 90, 159, 0.3);
        }

        img {
            filter: drop-shadow(0 0 20px rgba(139, 90, 159, 0.5));
        }

        input[type="text"] {
            background: var(--dark-purple);
            border: 2px solid var(--metallic-purple);
            color: var(--light-purple);
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--light-purple);
            box-shadow: 0 0 15px rgba(139, 90, 159, 0.6);
            background: #5a3a6f;
        }

        input[type="text"]::placeholder {
            color: #9a7aaf;
            opacity: 0.7;
        }

        button {
            background: var(--metallic-shine);
            border: 2px solid var(--metallic-purple);
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 90, 159, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #b388c4 0%, #8b5a9f 50%, #b388c4 100%);
            box-shadow: 0 6px 20px rgba(139, 90, 159, 0.6);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(139, 90, 159, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        select {
            background: var(--dark-purple);
            border: 2px solid var(--metallic-purple);
            color: var(--light-purple);
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover {
            border-color: var(--light-purple);
            box-shadow: 0 0 10px rgba(139, 90, 159, 0.4);
        }

        select:focus {
            outline: none;
            border-color: var(--light-purple);
            box-shadow: 0 0 15px rgba(139, 90, 159, 0.6);
        }

        audio {
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(139, 90, 159, 0.3);
        }

        audio::-webkit-media-controls-panel {
            background: var(--dark-purple);
        }

        #message {
            color: var(--light-purple);
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(139, 90, 159, 0.5);
        }

        .list-unstyled {
            color: var(--light-purple);
        }
    </style>
</head>

<body>
    <a href="https://github.com/coqui-ai/TTS"><img style="position: absolute; z-index:1000; top: 0; left: 0; border: 0;"
            src="https://s3.amazonaws.com/github/ribbons/forkme_left_darkblue_121621.png" alt="Fork me on GitHub"></a>

    <!-- Navigation -->
    <!--
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">Coqui TTS</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
              <a class="nav-link" href="#">Home
                <span class="sr-only">(current)</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    -->

    <!-- Page Content -->
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <img class="mt-5" src="{{url_for('static', filename='coqui-log-green-TTS.png')}}" align="middle"
                    width="512" />

                <!-- Admin controls -->
                <div style="position: absolute; top: 70px; right: 20px;">
                    <button id="change-password-btn" style="padding: 8px 15px; font-size: 14px; margin-right: 10px;">Passwort ändern</button>
                    <button onclick="location.href = '/admin/logout'" style="padding: 8px 15px; font-size: 14px;">Logout</button>
                </div>

                <ul class="list-unstyled">
                </ul>

                {%if use_gst%}
                <input value='{"0": 0.1}' id="style_wav" placeholder="style wav (dict or path to wav).." size=45
                    type="text" name="style_wav">
                {%endif%}

                <input id="text" placeholder="Type here..." size=45 type="text" name="text">
                <button id="speak-button" name="speak">Speak</button><br /><br />

                {%if use_multi_speaker%}
                Choose a speaker:
                <select id="speaker_id" name=speaker_id method="GET" action="/">
                    {% for speaker_id in speaker_ids %}
                    <option value="{{speaker_id}}" SELECTED>{{speaker_id}}</option>"
                    {% endfor %}
                </select><br /><br />
                {%endif%}

                {%if use_multi_language%}
                Choose a language:
                <select id="language_id" name=language_id method="GET" action="/">
                    {% for language_id in language_ids %}
                    <option value="{{language_id}}" SELECTED>{{language_id}}</option>"
                    {% endfor %}
                </select><br /><br />
                {%endif%}


                {%if show_details%}
                <button id="details-button" onclick="location.href = 'details'" name="model-details">Model
                    Details</button><br /><br />
                {%endif%}
                <audio id="audio" controls autoplay hidden></audio>
                <p id="message"></p>
            </div>
        </div>
    </div>

    <!-- Password change modal -->
    <div id="password-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
        <div style="background: linear-gradient(180deg, #0a0a0a 0%, #1a0a1f 50%, #0a0a0a 100%); padding: 30px; border-radius: 15px; box-shadow: 0 0 30px rgba(139, 90, 159, 0.5); max-width: 400px;">
            <h3 style="color: var(--light-purple); margin-bottom: 20px;">Passwort ändern</h3>
            <input type="password" id="old-password" placeholder="Altes Passwort" style="width: 100%; margin-bottom: 15px; background: var(--dark-purple); border: 2px solid var(--metallic-purple); color: var(--light-purple); padding: 10px; border-radius: 8px;" />
            <input type="password" id="new-password" placeholder="Neues Passwort (min. 8 Zeichen)" style="width: 100%; margin-bottom: 15px; background: var(--dark-purple); border: 2px solid var(--metallic-purple); color: var(--light-purple); padding: 10px; border-radius: 8px;" />
            <p id="password-message" style="color: var(--light-purple); min-height: 20px; margin-bottom: 15px;"></p>
            <button onclick="changePassword()" style="width: 48%; margin-right: 4%;">Ändern</button>
            <button onclick="closePasswordModal()" style="width: 48%;">Abbrechen</button>
        </div>
    </div>

    <!-- Bootstrap core JavaScript -->
    <script>
        function getTextValue(textId) {
            const container = q(textId)
            if (container) {
                return container.value
            }
            return ""
        }
        function q(selector) { return document.querySelector(selector) }

        // Password change functionality
        function showPasswordModal() {
            document.getElementById('password-modal').style.display = 'flex';
            document.getElementById('old-password').focus();
        }

        function closePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
            document.getElementById('old-password').value = '';
            document.getElementById('new-password').value = '';
            document.getElementById('password-message').textContent = '';
        }

        function changePassword() {
            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const messageEl = document.getElementById('password-message');

            if (!oldPassword || !newPassword) {
                messageEl.textContent = 'Bitte beide Felder ausfüllen';
                messageEl.style.color = '#ff6b6b';
                return;
            }

            fetch('/admin/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    messageEl.textContent = data.message;
                    messageEl.style.color = '#4caf50';
                    setTimeout(() => {
                        closePasswordModal();
                    }, 2000);
                } else {
                    messageEl.textContent = data.message;
                    messageEl.style.color = '#ff6b6b';
                }
            })
            .catch(error => {
                messageEl.textContent = 'Verbindungsfehler';
                messageEl.style.color = '#ff6b6b';
                console.error('Error:', error);
            });
        }

        document.getElementById('change-password-btn').addEventListener('click', showPasswordModal);

        q('#text').focus()
        function do_tts(e) {
            const text = q('#text').value
            const speaker_id = getTextValue('#speaker_id')
            const style_wav = getTextValue('#style_wav')
            const language_id = getTextValue('#language_id')
            if (text) {
                q('#message').textContent = 'Synthesizing...'
                q('#speak-button').disabled = true
                q('#audio').hidden = true
                synthesize(text, speaker_id, style_wav, language_id)
            }
            e.preventDefault()
            return false
        }
        q('#speak-button').addEventListener('click', do_tts)
        q('#text').addEventListener('keyup', function (e) {
            if (e.keyCode == 13) { // enter
                do_tts(e)
            }
        })
        function synthesize(text, speaker_id = "", style_wav = "", language_id = "") {
            fetch(`/api/tts?text=${encodeURIComponent(text)}&speaker_id=${encodeURIComponent(speaker_id)}&style_wav=${encodeURIComponent(style_wav)}&language_id=${encodeURIComponent(language_id)}`, { cache: 'no-cache' })
                .then(function (res) {
                    if (!res.ok) throw Error(res.statusText)
                    return res.blob()
                }).then(function (blob) {
                    q('#message').textContent = ''
                    q('#speak-button').disabled = false
                    q('#audio').src = URL.createObjectURL(blob)
                    q('#audio').hidden = false
                }).catch(function (err) {
                    q('#message').textContent = 'Error: ' + err.message
                    q('#speak-button').disabled = false
                })
        }
    </script>

</body>

</html>
